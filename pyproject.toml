[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-benchkit"
version = "0.1.0"
description = "Reproducible text LLM speed and sandboxed coding benchmarks with portable reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
llm-benchkit = "llm_benchkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
